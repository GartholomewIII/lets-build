
<!doctype html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    

    <style>
    
        
        section.vh-100 .card {
            max-width: clamp(320px, 85vw, 750px); 
            margin-inline: auto;
            overflow: hidden; 
        }


        section.vh-100 {
            height: auto !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }


        section.vh-100 .card-body {
            padding: clamp(1rem, 2.5vw, 2rem);
        }


        section.vh-100 .h1.fw-bold { font-size: clamp(1.25rem, 2.2vw, 1.75rem); }
        section.vh-100 h5 { font-size: clamp(1rem, 1.8vw, 1.25rem); }

        section.vh-100 .form-control-lg { font-size: 1rem; padding: .5rem .75rem; }
        section.vh-100 .btn.btn-lg       { font-size: 1rem; padding: .6rem 1rem; }


        section.vh-100 .row.g-0 { align-items: stretch; }

        section.vh-100 .d-none.d-md-block img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        section.vh-100 > .container.py-5 { padding-block: 2rem; }

</style>
</head>
<body>

<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">
        
        <div class="card" style="border-radius: 1rem;">
          <div class="row g-0">
            <div class="col-md-6 col-lg-5 d-none d-md-block">
            <img
                src="{% static 'assets/lets-build-login.png' %}"
                alt="login form"
                class="img-fluid"
                style="border-radius: 1rem 0 0 1rem;"
            />
            </div>
            <div class="col-md-6 col-lg-7 d-flex align-items-center">
              <div class="card-body p-4 p-lg-5 text-black">

                
                <form method="post">
                  {% csrf_token %}
                  {{ loginform.as_p }}

                  <div class="pt-1 mb-4">
                    <button class="btn btn-dark btn-lg w-100" type="submit">Login</button>
                  </div>

                  <a class="small text-muted" href="#!">Forgot password?</a>
                  <p class="mb-5 pb-lg-2" style="color: #393f81;">
                    Don't have an account? <a href="#!" style="color: #393f81;">Register here</a>
                  </p>
                  <a href="#!" class="small text-muted">Terms of use.</a>
                  <a href="#!" class="small text-muted">Privacy policy</a>
                </form>

              </div>
            </div>
          </div><!-- /row -->
        </div><!-- /card -->
      </div>
    </div>
  </div>
</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
